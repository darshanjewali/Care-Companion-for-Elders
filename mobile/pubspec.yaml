version: 1.0.0+1

environment:
  sdk: ">=3.4.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  http: ^1.2.2

  provider: ^6.1.2
  flutter_secure_storage: ^9.2.2
