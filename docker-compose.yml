version: "3.9"
services:
  mysql:
    image: mysql:8.4
    container_name: care-companion-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Set MYSQL_ROOT_PASSWORD before starting MySQL}
      MYSQL_DATABASE: care_companion
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql

volumes:
  mysql_data:
